name: Sync organization license

on:
  workflow_dispatch:
  # Fire from an org webhook relay (POST repos/Almana-mc/.github/dispatches)
  # when a new repository is created. Actions cannot listen org-wide directly.
  repository_dispatch:
    types: [repo-created]

jobs:
  sync-license:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.ORG_FILE_SYNC_TOKEN }}
      ORG: Almana-mc
      SOURCE_REPO: Almana-mc/.github
      SOURCE_FILE: LICENSE.md
      TARGET_FILE: LICENSE.md
      COMMIT_MESSAGE: Add organization license
    steps:
      - name: Copy license into repos missing one
        shell: bash
        run: |
          set -euo pipefail

          # Source license content, already base64 from the Contents API.
          license_b64="$(gh api "repos/${SOURCE_REPO}/contents/${SOURCE_FILE}" -q .content | tr -d '\n')"
          if [ -z "$license_b64" ]; then
            echo "failed: could not read source ${SOURCE_REPO}/${SOURCE_FILE}"
            exit 1
          fi

          # name<TAB>isArchived<TAB>defaultBranch per repo.
          gh repo list "$ORG" --limit 1000 \
            --json name,isArchived,defaultBranchRef \
            -q '.[] | [.name, (.isArchived|tostring), (.defaultBranchRef.name // "")] | @tsv' \
          | while IFS=$'\t' read -r name archived branch; do
              repo="${ORG}/${name}"

              if [ "$repo" = "$SOURCE_REPO" ]; then
                echo "skip source: ${repo}"
                continue
              fi

              if [ "$archived" = "true" ]; then
                echo "skip archived: ${repo}"
                continue
              fi

              if [ -z "$branch" ]; then
                echo "failed: ${repo} has no default branch (empty repo)"
                continue
              fi

              # Existing LICENSE.md sha + content (empty if absent).
              existing="$(gh api "repos/${repo}/contents/${TARGET_FILE}" 2>/dev/null || true)"
              sha="$(echo "$existing" | jq -r '.sha // empty')"
              current_b64="$(echo "$existing" | jq -r '.content // empty' | tr -d '\n')"

              if [ -n "$sha" ] && [ "$current_b64" = "$license_b64" ]; then
                echo "already in sync: ${repo}"
                continue
              fi

              sha_arg=()
              if [ -n "$sha" ]; then
                sha_arg=(-f "sha=${sha}")
              fi

              if err="$(gh api -X PUT "repos/${repo}/contents/${TARGET_FILE}" \
                   -f message="$COMMIT_MESSAGE" \
                   -f content="$license_b64" \
                   -f branch="$branch" \
                   "${sha_arg[@]}" 2>&1 >/dev/null)"; then
                if [ -n "$sha" ]; then
                  echo "license overridden: ${repo} (${branch})"
                else
                  echo "license added: ${repo} (${branch})"
                fi
              else
                echo "failed: ${repo} on ${branch}: $(echo "$err" | tr '\n' ' ')"
              fi
            done
